<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lima Investment Platform</title>
<style>
  :root{
    --bg:#0b0e14; --card:#131721; --card2:#0f1320; --border:#232936;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --accent-hover:#1f6feb;
    --green:#3fb950; --red:#f85149; --gold:#e3b341; --purple:#8b5cf6;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(11,14,20,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .logo{font-size:1.35rem;font-weight:700;color:var(--accent);cursor:pointer;letter-spacing:-.3px}
  .logo span{color:var(--text)}
  nav{display:flex;gap:6px}
  nav button{background:none;border:none;color:var(--muted);font-size:.95rem;cursor:pointer;padding:8px 14px;border-radius:8px;transition:.2s;font-weight:500}
  nav button:hover{color:var(--text);background:var(--card)}
  nav button.active{color:var(--text);background:var(--card)}
  .hdr-actions{display:flex;gap:10px;align-items:center}

  .btn{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.95rem;transition:.2s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover{background:#2f9e42}
  .btn-block{width:100%}
  .btn-lg{padding:14px 32px;font-size:1rem}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* PAGES */
  .page{display:none;animation:fade .35s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .wrap{max-width:1200px;margin:0 auto;padding:0 40px}

  /* HOME */
  .hero{text-align:center;padding:110px 20px 80px;background:radial-gradient(ellipse at top,#1a2332 0%,var(--bg) 70%)}
  .hero .tag{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(47,129,247,.12);border:1px solid rgba(47,129,247,.3);color:var(--accent);font-size:.8rem;font-weight:600;letter-spacing:.5px;margin-bottom:22px}
  .hero h1{font-size:3.1rem;line-height:1.15;margin-bottom:18px;letter-spacing:-1px}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--muted);max-width:620px;margin:0 auto 34px;font-size:1.1rem}
  .hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .stats{display:flex;justify-content:center;gap:60px;flex-wrap:wrap;padding:34px 20px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card)}
  .stat h3{color:var(--accent);font-size:1.7rem;font-weight:700}
  .stat p{color:var(--muted);font-size:.88rem}
  .section{padding:80px 0}
  .section-head{text-align:center;margin-bottom:50px}
  .section-head h2{font-size:2.1rem;margin-bottom:12px;letter-spacing:-.5px}
  .section-head p{color:var(--muted);max-width:560px;margin:0 auto}
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:24px}
  .plan{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:34px 28px;transition:.25s;position:relative}
  .plan:hover{border-color:var(--accent);transform:translateY(-4px)}
  .plan.featured{border-color:var(--accent);box-shadow:0 0 0 1px rgba(47,129,247,.25)}
  .plan.featured::before{content:'MOST POPULAR';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:1px;white-space:nowrap}
  .plan h3{font-size:1.25rem;margin-bottom:4px}
  .plan .roi{font-size:2.3rem;font-weight:700;color:var(--green);line-height:1.2}
  .plan .roi-label{color:var(--muted);font-size:.88rem;margin-bottom:20px}
  .plan ul{list-style:none;margin:0 0 26px}
  .plan ul li{padding:9px 0;color:var(--muted);border-bottom:1px solid var(--border);font-size:.92rem}
  .plan ul li::before{content:'✓';color:var(--green);font-weight:700;margin-right:10px}
  .calc-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:38px;max-width:520px;margin:0 auto}
  .calc-box label{display:block;margin-bottom:8px;color:var(--muted);font-size:.88rem}
  .calc-box input,.calc-box select{width:100%;padding:13px 15px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:18px;font-size:1rem;outline:none}
  .calc-box input:focus,.calc-box select:focus{border-color:var(--accent)}
  .calc-result{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:10px;padding:20px;text-align:center;margin-top:8px}
  .calc-result span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:4px}
  .calc-result strong{color:var(--green);font-size:1.8rem;font-weight:700}

  /* ABOUT */
  .about-hero{text-align:center;padding:90px 20px 50px;background:radial-gradient(ellipse at top,#1a2332 0%,var(--bg) 70%)}
  .about-hero h1{font-size:2.8rem;margin-bottom:16px;letter-spacing:-1px}
  .about-hero p{color:var(--muted);max-width:680px;margin:0 auto;font-size:1.08rem}
  .prose{max-width:820px;margin:0 auto}
  .prose h2{font-size:1.7rem;margin:52px 0 18px;letter-spacing:-.4px}
  .prose h2:first-child{margin-top:0}
  .prose p{color:#b6bfca;margin-bottom:16px;font-size:1.02rem}
  .prose ul{margin:0 0 20px 22px}
  .prose ul li{color:#b6bfca;margin-bottom:10px;font-size:1.02rem}
  .pull{border-left:3px solid var(--accent);background:var(--card);padding:22px 26px;border-radius:0 12px 12px 0;margin:30px 0;color:var(--text);font-style:italic;font-size:1.05rem}
  .values{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:34px 0}
  .value-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px}
  .value-card .ico{font-size:1.5rem;margin-bottom:10px}
  .value-card h4{font-size:1.05rem;margin-bottom:8px}
  .value-card p{color:var(--muted);font-size:.92rem;margin:0}
  .disclaimer{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);border-radius:12px;padding:22px 26px;margin:40px 0 0}
  .disclaimer h4{color:var(--red);font-size:.95rem;margin-bottom:8px;letter-spacing:.3px}
  .disclaimer p{color:#b6bfca;font-size:.9rem;margin:0}

  /* AUTH */
  .auth-wrap{min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:50px 20px}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:44px 40px;width:100%;max-width:440px}
  .auth-card h2{font-size:1.6rem;text-align:center;margin-bottom:8px}
  .auth-card .sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:30px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:7px;font-weight:500}
  .field input,.field select{width:100%;padding:13px 15px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.98rem;outline:none;transition:.2s;font-family:inherit}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.12)}
  .auth-foot{text-align:center;margin-top:22px;color:var(--muted);font-size:.9rem}
  .auth-foot a{color:var(--accent);cursor:pointer;font-weight:600}
  .auth-foot a:hover{text-decoration:underline}
  .msg{padding:12px 16px;border-radius:9px;font-size:.9rem;margin-bottom:18px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.35);color:#ff9b95}
  .msg.ok{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.35);color:#7ee08a}

  /* DASHBOARD */
  .dash-layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 73px)}
  .sidebar{background:var(--card2);border-right:1px solid var(--border);padding:28px 18px}
  .sidebar .who{display:flex;align-items:center;gap:12px;padding:0 10px 22px;border-bottom:1px solid var(--border);margin-bottom:20px}
  .sidebar .who .avatar{width:42px;height:42px;font-size:1rem;margin:0}
  .sidebar .who strong{display:block;font-size:.92rem;line-height:1.3}
  .sidebar .who span{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;display:block}
  .side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;color:var(--muted);font-size:.92rem;cursor:pointer;transition:.2s;margin-bottom:4px;font-weight:500}
  .side-link:hover{background:var(--bg);color:var(--text)}
  .side-link.active{background:rgba(47,129,247,.12);color:var(--accent)}
  .side-link.logout{color:#ff9b95;margin-top:14px}
  .side-link.logout:hover{background:rgba(248,81,73,.1);color:#ff9b95}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;color:#fff}
  .dash-main{padding:36px 40px;overflow-x:hidden}
  .dash-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:30px}
  .dash-top h1{font-size:1.7rem;letter-spacing:-.4px}
  .dash-top p{color:var(--muted);font-size:.92rem}
  .balance-card{background:linear-gradient(135deg,#1b2f52 0%,#16233a 55%,#131721 100%);border:1px solid rgba(47,129,247,.3);border-radius:20px;padding:38px 40px;margin-bottom:26px;position:relative;overflow:hidden}
  .balance-card::after{content:'';position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(47,129,247,.22),transparent 70%);border-radius:50%}
  .balance-card .label{color:#9dc0f5;font-size:.82rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;margin-bottom:10px;position:relative;z-index:1;display:flex;align-items:center;gap:10px}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(63,185,80,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.6)}70%{box-shadow:0 0 0 10px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .balance-card .amount{font-size:3.6rem;font-weight:700;letter-spacing:-2px;line-height:1.05;color:#fff;position:relative;z-index:1;word-break:break-all;font-variant-numeric:tabular-nums}
  .balance-card .amount .cents{font-size:2rem;color:#9dc0f5;font-weight:700}
  .balance-card .ticker-sub{color:#7ee08a;font-size:.9rem;margin-top:6px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .balance-card .meta{display:flex;gap:34px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:1;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
  .balance-card .meta div span{display:block;color:#9dc0f5;font-size:.78rem;margin-bottom:3px;letter-spacing:.4px}
  .balance-card .meta div strong{font-size:1.05rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  .balance-card .meta div strong.up{color:#7ee08a}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:30px}
  .d-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;transition:.2s}
  .d-card:hover{border-color:#2f3a4d}
  .d-card h4{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;font-weight:600}
  .d-card .val{font-size:1.65rem;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .d-card .val.green{color:var(--green)}
  .d-card .val.red{color:var(--red)}
  .d-card .val.gold{color:var(--gold)}
  .d-card .sub{font-size:.8rem;color:var(--muted);margin-top:6px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:26px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .panel-head h3{font-size:1.15rem}
  .panel-head .hint{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;font-weight:600;padding:0 0 12px;border-bottom:1px solid var(--border)}
  td{padding:15px 0;border-bottom:1px solid var(--border);font-size:.92rem}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
  .pill.ok{background:rgba(63,185,80,.14);color:#7ee08a}
  .pill.wait{background:rgba(227,179,65,.14);color:var(--gold)}
  .pill.out{background:rgba(248,81,73,.14);color:#ff9b95}
  .amt-in{color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
  .amt-out{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums}
  .prog-row{margin-bottom:20px}
  .prog-row:last-child{margin-bottom:0}
  .prog-top{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px}
  .prog-top span{color:var(--muted)}
  .bar{height:8px;background:var(--bg);border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:20px;transition:width 1s ease}

  /* TRANSFER */
  .transfer-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
  .quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .qa-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85rem;cursor:pointer;transition:.2s;font-weight:600}
  .qa-btn:hover{border-color:var(--accent);color:var(--accent)}
  .summary-box{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:24px}
  .summary-box h4{font-size:1rem;margin-bottom:18px}
  .summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border);font-size:.9rem}
  .summary-row:last-of-type{border-bottom:none}
  .summary-row span{color:var(--muted)}
  .summary-row strong{font-weight:600;font-variant-numeric:tabular-nums}
  .summary-total{display:flex;justify-content:space-between;padding:16px 0 0;margin-top:12px;border-top:2px solid var(--border);font-size:1.05rem}
  .summary-total strong{color:var(--green);font-size:1.3rem;font-weight:700}
  .info-list{margin-top:20px}
  .info-list li{list-style:none;padding:9px 0;color:var(--muted);font-size:.85rem;display:flex;gap:10px;align-items:flex-start}
  .info-list li::before{content:'•';color:var(--accent);font-weight:700;font-size:1.2rem;line-height:1}
  .warn-box{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.3);border-radius:10px;padding:14px 18px;font-size:.85rem;color:#f0d478;margin-bottom:20px}

  /* SAVED BANKS */
  .saved-banks{margin-bottom:24px}
  .saved-banks h4{font-size:.95rem;margin-bottom:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  .bank-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:.2s}
  .bank-card:hover{border-color:var(--accent);background:rgba(47,129,247,.05)}
  .bank-card.selected{border-color:var(--accent);background:rgba(47,129,247,.1)}
  .bank-card .bank-info{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
  .bank-logo{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#fff;letter-spacing:-.5px}
  .bank-card .bank-name{font-weight:600;font-size:.95rem;line-height:1.3}
  .bank-card .bank-meta{font-size:.78rem;color:var(--muted)}
  .bank-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px 10px;border-radius:6px;transition:.2s}
  .bank-x:hover{background:rgba(248,81,73,.1);color:var(--red)}
  .save-check{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:.9rem;cursor:pointer}
  .save-check input{width:auto;margin:0;accent-color:var(--accent)}

  /* HISTORY */
  .history-table td .ref{font-family:monospace;font-size:.82rem;color:var(--muted)}
  .history-table td .bank-cell{display:flex;align-items:center;gap:10px}
  .history-table td .mini-logo{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;color:#fff}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty-state .big{font-size:2.5rem;margin-bottom:14px;opacity:.4}
  .empty-state p{font-size:.92rem}

  /* REVIEW & CONFIRM */
  .review-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:34px;max-width:620px;margin:0 auto}
  .review-card .review-head{text-align:center;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:26px}
  .review-card .review-head .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:rgba(47,129,247,.12);border:1px solid rgba(47,129,247,.3);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
  .review-card .review-head h3{font-size:1.35rem;margin-bottom:6px}
  .review-card .review-head p{color:var(--muted);font-size:.92rem}
  .review-amount{text-align:center;padding:26px 20px;margin-bottom:24px;background:linear-gradient(135deg,rgba(47,129,247,.08),rgba(139,92,246,.06));border:1px solid rgba(47,129,247,.25);border-radius:14px}
  .review-amount .lbl{color:#9dc0f5;font-size:.78rem;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:8px}
  .review-amount .big{font-size:2.6rem;font-weight:700;color:#fff;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
  .review-amount .fee-note{color:var(--muted);font-size:.85rem;margin-top:8px}
  .review-section{margin-bottom:22px}
  .review-section h5{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:12px}
  .review-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--border);font-size:.92rem}
  .review-row:last-child{border-bottom:none}
  .review-row .k{color:var(--muted)}
  .review-row .v{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
  .review-note{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.25);border-radius:10px;padding:14px 18px;font-size:.85rem;color:#f0d478;margin-bottom:24px;line-height:1.5}
  .review-actions{display:flex;gap:12px;margin-top:8px}
  .review-actions .btn{flex:1;padding:15px}
  .confirm-check{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:22px;cursor:pointer;font-size:.88rem;color:#b6bfca;line-height:1.5}
  .confirm-check input{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .success-card{background:var(--card);border:1px solid rgba(63,185,80,.3);border-radius:16px;padding:44px 36px;max-width:560px;margin:0 auto;text-align:center}
  .success-card .check-circle{width:80px;height:80px;border-radius:50%;margin:0 auto 22px;background:rgba(63,185,80,.12);border:2px solid rgba(63,185,80,.4);display:flex;align-items:center;justify-content:center;font-size:2.4rem;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  .success-card h2{font-size:1.5rem;margin-bottom:10px}
  .success-card p{color:var(--muted);margin-bottom:26px;font-size:.96rem}
